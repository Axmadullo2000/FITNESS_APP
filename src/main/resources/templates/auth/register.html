<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Регистрация — GymApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

    <div class="auth-split">

        <!-- Left hero -->
        <div class="auth-hero">
            <div class="auth-hero__logo">
                <div class="auth-hero__logo-icon"><i class="bi bi-activity"></i></div>
                <span class="auth-hero__logo-name">GymApp</span>
            </div>
            <div class="auth-hero__tagline">Начни своё фитнес-путешествие сегодня</div>
            <div class="auth-hero__sub">
                Зарегистрируйтесь и получите цифровой абонемент,
                QR-карту для входа и личный кабинет.
            </div>
            <div class="auth-hero__stats">
                <div class="auth-hero__stat">
                    <div class="auth-hero__stat-val">QR</div>
                    <div class="auth-hero__stat-label">Вход</div>
                </div>
                <div class="auth-hero__stat">
                    <div class="auth-hero__stat-val">∞</div>
                    <div class="auth-hero__stat-label">Тренировок</div>
                </div>
                <div class="auth-hero__stat">
                    <div class="auth-hero__stat-val">1</div>
                    <div class="auth-hero__stat-label">Приложение</div>
                </div>
            </div>
        </div>

        <!-- Right form -->
        <div class="auth-form-panel">
            <div class="auth-form-wrap">
                <h1 class="auth-title">Регистрация</h1>
                <p class="auth-subtitle">Создайте аккаунт клиента зала</p>

                <div th:if="${error}" class="auth-alert auth-alert--error">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${error}"></span>
                </div>
                <div th:if="${success}" class="auth-alert auth-alert--success">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${success}"></span>
                </div>

                <form th:action="@{/register}" method="post">
                    <div class="auth-form-row" style="margin-bottom:1rem;">
                        <div class="auth-field" style="margin-bottom:0;">
                            <label class="auth-label">Имя</label>
                            <input type="text" name="firstName" class="auth-input"
                                   placeholder="Ваше имя" required/>
                        </div>
                        <div class="auth-field" style="margin-bottom:0;">
                            <label class="auth-label">Фамилия</label>
                            <input type="text" name="lastName" class="auth-input"
                                   placeholder="Ваша фамилия" required/>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Телефон</label>
                        <input type="tel"
                               name="phone"
                               class="auth-input"
                               id="phoneInput"
                               placeholder="+998 XX XXX XX XX"
                               pattern="\+998[0-9]{9}"
                               maxlength="13"
                               required/>
                        <span class="auth-field-hint" id="phoneHint" style="font-size:0.75rem; color:#8a8a9a; margin-top:4px; display:block;">Формат: +998901234567</span>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Пароль</label>
                        <input type="password" name="password" class="auth-input"
                               placeholder="Минимум 6 символов" minlength="6" required/>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Пол</label>
                        <div class="gender-toggle">
                            <label class="gender-option">
                                <input type="radio" name="gender" value="MALE" required/>
                                <i class="bi bi-gender-male"></i> Мужской
                            </label>
                            <label class="gender-option">
                                <input type="radio" name="gender" value="FEMALE"/>
                                <i class="bi bi-gender-female"></i> Женский
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn">
                        <i class="bi bi-person-check-fill"></i> Создать аккаунт
                    </button>
                </form>

                <div class="auth-divider">или</div>

                <div class="auth-link-row">
                    Уже есть аккаунт? <a href="/login">Войти</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        const phone = document.getElementById('phoneInput');
        phone.addEventListener('input', function () {
            let val = this.value.replace(/\D/g, '');
            if (!val.startsWith('998')) val = '998' + val.replace(/^998/, '');
            val = val.slice(0, 12);
            this.value = '+' + val;
        });
        phone.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && this.value === '+998') {
                e.preventDefault();
            }
        });
        phone.addEventListener('focus', function () {
            if (!this.value) this.value = '+998';
        });
    </script>
</body>
</html>
