<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Регистрация — GymApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

<div class="auth-split">
    <!-- Hero panel -->
    <div class="auth-hero">
        <div class="auth-hero__logo"><i class="bi bi-activity"></i></div>
        <h1 class="auth-hero__title">GymApp</h1>
        <p class="auth-hero__sub">Присоединяйтесь к нам</p>
        <div class="auth-hero__features">
            <div class="auth-hero__feature"><i class="bi bi-qr-code"></i> Личная карточка с QR-кодом</div>
            <div class="auth-hero__feature"><i class="bi bi-calendar-check"></i> История посещений</div>
            <div class="auth-hero__feature"><i class="bi bi-telephone"></i> Вход по номеру телефона</div>
        </div>
    </div>

    <!-- Form panel -->
    <div class="auth-form-panel">
        <div class="auth-form-wrap">
            <div class="auth-form-header">
                <h2 class="auth-form-title">Создать аккаунт</h2>
                <p class="auth-form-sub">Телефон будет использоваться для входа</p>
            </div>

            <div th:if="${error}" class="auth-alert auth-alert--error">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}">Ошибка</span>
            </div>

            <form th:action="@{/register}" method="post" id="regForm">
                <div class="auth-field-row">
                    <div class="auth-field">
                        <label class="auth-label">Имя</label>
                        <div class="auth-input-wrap">
                            <i class="bi bi-person auth-input-icon"></i>
                            <input type="text" name="firstName" class="auth-input"
                                   placeholder="Ваше имя" required="required"/>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Фамилия</label>
                        <div class="auth-input-wrap">
                            <i class="bi bi-person auth-input-icon"></i>
                            <input type="text" name="lastName" class="auth-input"
                                   placeholder="Ваша фамилия" required="required"/>
                        </div>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label">Номер телефона <span style="color:#F97316;">(логин для входа)</span></label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-telephone auth-input-icon"></i>
                        <input type="tel" name="phone" id="regPhone" class="auth-input"
                               placeholder="+998 XX XXX XX XX" required="required"/>
                    </div>
                    <div style="font-size:.72rem;color:var(--auth-muted,#6B7280);margin-top:.35rem;">
                        Начинается с +998. Пробелы убираются автоматически.
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label">Пол</label>
                    <div class="gender-toggle">
                        <label class="gender-option">
                            <input type="radio" name="gender" value="MALE" required="required"/>
                            <i class="bi bi-gender-male"></i> Мужской
                        </label>
                        <label class="gender-option">
                            <input type="radio" name="gender" value="FEMALE" required="required"/>
                            <i class="bi bi-gender-female"></i> Женский
                        </label>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label">Пароль</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-lock auth-input-icon"></i>
                        <input type="password" name="password" class="auth-input"
                               placeholder="Придумайте пароль" required="required"/>
                    </div>
                </div>

                <button type="submit" class="auth-btn">
                    <i class="bi bi-person-check-fill"></i> Зарегистрироваться
                </button>
            </form>

            <div class="auth-divider">уже есть аккаунт?</div>

            <a th:href="@{/login}" class="auth-link-btn">
                <i class="bi bi-box-arrow-in-right"></i> Войти в систему
            </a>
        </div>
    </div>
</div>

<script>
    // Normalize phone on submit: strip all spaces, add +998 prefix if needed
    document.getElementById('regForm').addEventListener('submit', function() {
        const input = document.getElementById('regPhone');
        let val = input.value.replace(/\s+/g, '');
        if (val.startsWith('+998')) {
            // already good
        } else if (val.startsWith('998') && val.length >= 11) {
            val = '+' + val;
        } else if (/^\d{9}$/.test(val)) {
            val = '+998' + val;
        }
        input.value = val;
    });

    // Live formatting hint: auto-prepend +998 when user starts typing digits
    document.getElementById('regPhone').addEventListener('input', function() {
        let val = this.value;
        if (val.length === 1 && /^[1-9]$/.test(val)) {
            // User typed a single digit — likely starting a 9-digit number
            this.value = '+998' + val;
        }
    });
</script>

</body>
</html>
