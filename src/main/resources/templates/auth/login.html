<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Вход — GymApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

<div class="auth-split">
    <!-- Hero panel -->
    <div class="auth-hero">
        <div class="auth-hero__logo"><i class="bi bi-activity"></i></div>
        <h1 class="auth-hero__title">GymApp</h1>
        <p class="auth-hero__sub">Система управления фитнес-клубом</p>
        <div class="auth-hero__features">
            <div class="auth-hero__feature"><i class="bi bi-qr-code-scan"></i> QR-регистрация входа</div>
            <div class="auth-hero__feature"><i class="bi bi-people"></i> Управление клиентами</div>
            <div class="auth-hero__feature"><i class="bi bi-bar-chart"></i> Аналитика посещений</div>
        </div>
    </div>

    <!-- Form panel -->
    <div class="auth-form-panel">
        <div class="auth-form-wrap">
            <div class="auth-form-header">
                <h2 class="auth-form-title">Добро пожаловать</h2>
                <p class="auth-form-sub">Войдите с номером телефона</p>
            </div>

            <div th:if="${param.error}" class="auth-alert auth-alert--error">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Неверный номер телефона или пароль
            </div>
            <div th:if="${param.logout}" class="auth-alert auth-alert--success">
                <i class="bi bi-check-circle-fill"></i>
                Вы успешно вышли из системы
            </div>

            <form th:action="@{/login}" method="post" id="loginForm">
                <div class="auth-field">
                    <label class="auth-label">Номер телефона</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-telephone auth-input-icon"></i>
                        <input type="tel" name="username" id="phoneInput" class="auth-input"
                               placeholder="+998 XX XXX XX XX" required="required" autofocus="autofocus"/>
                    </div>
                </div>
                <div class="auth-field">
                    <label class="auth-label">Пароль</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-lock auth-input-icon"></i>
                        <input type="password" name="password" class="auth-input"
                               placeholder="Введите пароль" required="required"/>
                    </div>
                </div>
                <button type="submit" class="auth-btn">
                    <i class="bi bi-box-arrow-in-right"></i> Войти
                </button>
            </form>

            <div class="auth-divider">или</div>

            <a th:href="@{/register}" class="auth-link-btn">
                <i class="bi bi-person-plus"></i> Зарегистрироваться как клиент
            </a>
        </div>
    </div>
</div>

<script>
    // Normalize phone before form submit: strip spaces, ensure +998 prefix
    document.getElementById('loginForm').addEventListener('submit', function() {
        const input = document.getElementById('phoneInput');
        let val = input.value.replace(/\s+/g, '');
        if (val !== 'admin') {
            if (val.startsWith('998') && val.length >= 11) val = '+' + val;
            else if (/^\d{9}$/.test(val)) val = '+998' + val;
            else if (!val.startsWith('+')) val = val; // leave as-is for admin etc.
        }
        input.value = val;
    });
</script>

</body>
</html>
