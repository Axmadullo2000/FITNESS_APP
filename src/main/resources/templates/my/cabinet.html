<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <title>Мой кабинет — GymApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/cabinet.css}"/>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">
        <i class="bi bi-activity"></i> GymApp
    </span>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="topbar__logout">
            <i class="bi bi-box-arrow-right"></i> Выйти
        </button>
    </form>
</header>

<div class="cab-wrap">

    <!-- Profile hero -->
    <div class="profile-hero">
        <div class="profile-avatar"
             th:text="${#strings.substring(client.firstName,0,1) + #strings.substring(client.lastName,0,1)}">
            АН
        </div>
        <div class="profile-name" th:text="${client.fullName}">Имя Фамилия</div>
        <div class="profile-phone" th:text="${client.phone}">+998…</div>

        <span th:if="${card != null}" class="status-pill status-pill--active">
            <i class="bi bi-circle-fill"></i> Абонемент активен
        </span>
        <span th:if="${card == null}" class="status-pill status-pill--inactive">
            <i class="bi bi-x-circle"></i> Нет абонемента
        </span>
    </div>

    <!-- Membership card -->
    <div th:if="${card != null}" class="membership-card">
        <div class="mc-logo"><i class="bi bi-activity"></i> GymApp — Абонемент</div>
        <div class="mc-name" th:text="${client.fullName}">Имя Фамилия</div>
        <div class="mc-sub">Персональный абонемент</div>

        <!-- Session dots -->
        <div class="mc-dots">
            <span th:each="i : ${#numbers.sequence(1, card.totalSessions)}">
                <div class="mc-dot"
                     th:classappend="${i le (card.totalSessions - card.remainingSessions)} ? ' mc-dot--used' : ' mc-dot--left'">
                </div>
            </span>
        </div>

        <!-- Progress -->
        <div class="mc-progress-track">
            <div class="mc-progress-fill"
                 th:classappend="${card.remainingSessions le card.totalSessions / 4} ? ' mc-progress-fill--warn' : ''"
                 th:style="'width:' + ${(card.remainingSessions * 100) / card.totalSessions} + '%'">
            </div>
        </div>

        <!-- Stats -->
        <div class="mc-stats">
            <div>
                <div class="mc-stat-label">Осталось занятий</div>
                <div class="mc-stat-val"
                     th:text="${card.remainingSessions} + ' / ' + ${card.totalSessions}"></div>
            </div>
            <div>
                <div class="mc-stat-label">Статус</div>
                <div class="mc-stat-val"
                     th:text="${card.status.name() == 'IN_USE'} ? 'В зале' : 'Активен'"></div>
            </div>
            <div>
                <div class="mc-stat-label">Действует до</div>
                <div class="mc-stat-val"
                     th:text="${#temporals.format(card.expiresAt, 'dd.MM.yyyy')}"></div>
            </div>
        </div>
    </div>

    <!-- QR Code -->
    <div class="qr-card">
        <div class="qr-label"><i class="bi bi-qr-code"></i> QR-код для входа</div>
        <div class="qr-image-wrap">
            <img th:src="@{/clients/{id}/qr(id=${client.id})}" alt="QR-код"/>
        </div>
        <div class="qr-hint">
            <i class="bi bi-qr-code-scan"></i>
            Покажите QR-код на входе в зал
        </div>
    </div>

    <!-- No card -->
    <div th:if="${card == null}" class="no-card">
        <i class="bi bi-exclamation-triangle"></i>
        <p>У вас нет активного абонемента.<br/>Обратитесь к администратору зала.</p>
    </div>

</div>
</body>
</html>
