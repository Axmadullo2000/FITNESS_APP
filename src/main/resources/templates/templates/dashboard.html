<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Главная', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <h4 class="page-title"><i class="bi bi-speedometer2"></i>Панель управления</h4>

    <!-- Статистика -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
                <div class="icon-wrap blue"><i class="bi bi-people-fill"></i></div>
                <div>
                    <div class="stat-label">Всего клиентов</div>
                    <div class="stat-value" th:text="${totalClients}">0</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
                <div class="icon-wrap green"><i class="bi bi-person-check-fill"></i></div>
                <div>
                    <div class="stat-label">Сейчас в зале</div>
                    <div class="stat-value" th:text="${currentVisitors}">0</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
                <div class="icon-wrap orange"><i class="bi bi-lock-fill"></i></div>
                <div>
                    <div class="stat-label">Занято шкафчиков</div>
                    <div class="stat-value" th:text="${occupiedLockers}">0</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
                <div class="icon-wrap purple"><i class="bi bi-unlock-fill"></i></div>
                <div>
                    <div class="stat-label">Свободно шкафчиков</div>
                    <div class="stat-value" th:text="${freeLockers}">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Кто сейчас в зале -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-person-fill-check me-2"></i>Клиенты в зале прямо сейчас</span>
            <a href="/visits" class="btn btn-sm btn-primary">
                <i class="bi bi-door-open me-1"></i>Вход / Выход
            </a>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(currentVisits)}" class="empty-state">
                <i class="bi bi-person-slash"></i>
                <p>В зале никого нет</p>
            </div>
            <table th:unless="${#lists.isEmpty(currentVisits)}" class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Клиент</th>
                        <th>Телефон</th>
                        <th>Шкафчик</th>
                        <th>Время входа</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="visit : ${currentVisits}">
                        <td>
                            <a th:href="@{/clients/{id}(id=${visit.client.id})}"
                               class="fw-semibold text-decoration-none"
                               th:text="${visit.client.fullName}"></a>
                        </td>
                        <td class="text-muted" th:text="${visit.client.phone}"></td>
                        <td>
                            <span class="badge bg-warning text-dark">
                                №<span th:text="${visit.locker.lockerNumber}"></span>
                            </span>
                        </td>
                        <td class="text-muted" th:text="${#temporals.format(visit.checkIn, 'HH:mm')}"></td>
                        <td class="text-end">
                            <form th:action="@{/visits/checkout/{id}(id=${visit.client.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    <i class="bi bi-box-arrow-right me-1"></i>Выход
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
