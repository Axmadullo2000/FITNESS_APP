<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Главная', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <h4 class="mb-4 fw-bold"><i class="bi bi-speedometer2 me-2"></i>Панель управления</h4>

    <!-- Статистика -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card card-stat blue shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-people-fill fs-2 text-primary"></i>
                    <div>
                        <div class="text-muted small">Всего клиентов</div>
                        <div class="fs-3 fw-bold" th:text="${totalClients}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card card-stat green shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-person-check-fill fs-2 text-success"></i>
                    <div>
                        <div class="text-muted small">Сейчас в зале</div>
                        <div class="fs-3 fw-bold" th:text="${currentVisitors}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card card-stat orange shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-key-fill fs-2 text-warning"></i>
                    <div>
                        <div class="text-muted small">Занято шкафчиков</div>
                        <div class="fs-3 fw-bold" th:text="${occupiedLockers}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card card-stat red shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-lock-fill fs-2 text-danger"></i>
                    <div>
                        <div class="text-muted small">Свободно шкафчиков</div>
                        <div class="fs-3 fw-bold" th:text="${freeLockers}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Кто сейчас в зале -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-person-fill-check me-1"></i>Клиенты в зале прямо сейчас</span>
            <a href="/visits" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-door-open me-1"></i>Вход / Выход
            </a>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(currentVisits)}" class="text-muted p-3">
                <i class="bi bi-info-circle me-1"></i>В зале никого нет
            </div>
            <table th:unless="${#lists.isEmpty(currentVisits)}" class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Клиент</th>
                        <th>Телефон</th>
                        <th>Шкафчик</th>
                        <th>Время входа</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="visit : ${currentVisits}">
                        <td th:text="${visit.client.fullName}"></td>
                        <td th:text="${visit.client.phone}"></td>
                        <td>
                            <span class="badge bg-warning text-dark">
                                №<span th:text="${visit.locker.lockerNumber}"></span>
                            </span>
                        </td>
                        <td th:text="${#temporals.format(visit.checkIn, 'HH:mm')}"></td>
                        <td>
                            <form th:action="@{/visits/checkout/{id}(id=${visit.client.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-box-arrow-right"></i> Выход
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
