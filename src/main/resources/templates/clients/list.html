<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Клиенты', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-people me-2"></i>Клиенты</h4>
        <a href="/clients/new" class="btn btn-primary">
            <i class="bi bi-person-plus me-1"></i>Новый клиент
        </a>
    </div>

    <!-- Поиск -->
    <form class="mb-3" method="get" action="/clients">
        <div class="input-group" style="max-width: 420px;">
            <input type="text" class="form-control" name="q"
                   th:value="${q}" placeholder="Поиск по имени, фамилии, телефону..."/>
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i>
            </button>
            <a th:if="${q}" href="/clients" class="btn btn-outline-danger">
                <i class="bi bi-x"></i>
            </a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(clients)}" class="text-muted p-4 text-center">
                <i class="bi bi-person-x fs-2 d-block mb-2"></i>
                Клиенты не найдены
            </div>
            <table th:unless="${#lists.isEmpty(clients)}" class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>ФИО</th>
                    <th>Пол</th>
                    <th>Телефон</th>
                    <th>Дата регистрации</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="client, stat : ${clients}">
                    <td class="text-muted" th:text="${stat.count}"></td>
                    <td>
                        <a th:href="@{/clients/{id}(id=${client.id})}"
                           class="text-decoration-none fw-semibold"
                           th:text="${client.fullName}"></a>
                    </td>
                    <td>
                        <span th:if="${client.gender != null}" class="badge"
                              th:classappend="${client.gender.name() == 'MALE'} ? 'bg-primary' : 'bg-danger'">
                            <i th:class="${client.gender.name() == 'MALE'} ? 'bi bi-gender-male' : 'bi bi-gender-female'"></i>
                            <span th:text="${client.gender.name() == 'MALE'} ? 'М' : 'Ж'"></span>
                        </span>
                    </td>
                    <td th:text="${client.phone}"></td>
                    <td th:text="${#temporals.format(client.createdAt, 'dd.MM.yyyy')}"></td>
                    <td class="text-end">
                        <a th:href="@{/clients/{id}(id=${client.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i> Подробнее
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
