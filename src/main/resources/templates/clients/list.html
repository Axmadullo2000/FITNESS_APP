<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Клиенты', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Клиенты</h1>
            <p class="page-subtitle">Управление базой клиентов</p>
        </div>
        <a href="/clients/new" class="btn btn--primary">
            <i class="bi bi-person-plus-fill"></i> Новый клиент
        </a>
    </div>

    <!-- Search -->
    <div style="margin-bottom:1.25rem;">
        <form method="get" action="/clients" style="display:flex;align-items:center;gap:.6rem;">
            <div class="search-bar" style="max-width:360px;flex:1;">
                <i class="bi bi-search search-bar__icon"></i>
                <input type="text" name="q" th:value="${q}"
                       placeholder="Поиск по имени или телефону…"/>
            </div>
            <button type="submit" class="btn btn--ghost">Найти</button>
            <a th:if="${q}" href="/clients" class="btn btn--danger btn--sm">
                <i class="bi bi-x"></i> Сбросить
            </a>
        </form>
    </div>

    <div class="card">
        <div class="card-body-0">
            <div th:if="${#lists.isEmpty(clients)}" class="empty-state">
                <i class="bi bi-person-x"></i>
                <div class="empty-state__title">Клиенты не найдены</div>
                <div style="font-size:.78rem;">Попробуйте изменить поисковый запрос</div>
            </div>
            <table th:unless="${#lists.isEmpty(clients)}" class="data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Клиент</th>
                    <th>Пол</th>
                    <th>Телефон</th>
                    <th>Регистрация</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="client, stat : ${clients}">
                    <td style="color:var(--text-light);width:40px;" th:text="${stat.count}"></td>
                    <td>
                        <div class="client-row">
                            <div th:classappend="${client.gender != null and client.gender.name() == 'MALE'} ? ' client-avatar--m' : ' client-avatar--f'"
                                 class="client-avatar"
                                 th:text="${#strings.substring(client.firstName,0,1) + #strings.substring(client.lastName,0,1)}">
                            </div>
                            <div>
                                <div><a th:href="@{/clients/{id}(id=${client.id})}"
                                        class="client-row__name"
                                        th:text="${client.fullName}"></a></div>
                                <div class="client-row__sub" th:text="${client.phone}"></div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span th:if="${client.gender != null}" class="badge"
                              th:classappend="${client.gender.name() == 'MALE'} ? ' badge--male' : ' badge--female'">
                            <i th:class="${client.gender.name() == 'MALE'} ? 'bi bi-gender-male' : 'bi bi-gender-female'"></i>
                            <span th:text="${client.gender.name() == 'MALE'} ? 'Муж' : 'Жен'"></span>
                        </span>
                    </td>
                    <td style="color:var(--text-muted);" th:text="${client.phone}"></td>
                    <td style="color:var(--text-muted);" th:text="${#temporals.format(client.createdAt, 'dd.MM.yyyy')}"></td>
                    <td style="text-align:right;">
                        <a th:href="@{/clients/{id}(id=${client.id})}" class="btn btn--ghost btn--sm">
                            <i class="bi bi-eye"></i> Профиль
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
