<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Новый клиент', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <div class="d-flex align-items-center gap-2 mb-4">
        <a href="/clients" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="fw-bold mb-0">Регистрация нового клиента</h4>
    </div>

    <div class="card shadow-sm" style="max-width: 500px;">
        <div class="card-body">
            <form th:action="@{/clients/new}" method="post" th:object="${client}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Имя <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{firstName}"
                           placeholder="Введите имя" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Фамилия <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{lastName}"
                           placeholder="Введите фамилию" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Номер телефона <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" th:field="*{phone}"
                           placeholder="+998 90 123 45 67" required/>
                    <div class="form-text text-muted">Номер должен быть уникальным</div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Пол <span class="text-danger">*</span></label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{gender}" value="MALE" id="genderMale" required/>
                            <label class="form-check-label" for="genderMale">
                                <i class="bi bi-gender-male me-1"></i>Мужской
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{gender}" value="FEMALE" id="genderFemale" required/>
                            <label class="form-check-label" for="genderFemale">
                                <i class="bi bi-gender-female me-1"></i>Женский
                            </label>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-person-plus me-1"></i>Зарегистрировать
                    </button>
                    <a href="/clients" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
