<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Новый клиент', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <div class="page-header">
        <div style="display:flex;align-items:center;gap:1rem;">
            <a href="/clients" class="btn btn--ghost btn--sm"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h1 class="page-title">Новый клиент</h1>
                <p class="page-subtitle">Регистрация нового клиента</p>
            </div>
        </div>
    </div>

    <div class="card" style="max-width:520px;">
        <div class="card-body">
            <form th:action="@{/clients/new}" method="post" th:object="${client}">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">Имя *</label>
                        <input type="text" class="form-control" th:field="*{firstName}"
                               placeholder="Введите имя" required="required"/>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">Фамилия *</label>
                        <input type="text" class="form-control" th:field="*{lastName}"
                               placeholder="Введите фамилию" required="required"/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Телефон *</label>
                    <input type="tel" class="form-control" th:field="*{phone}"
                           placeholder="+998 90 123 45 67" required="required"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Пол *</label>
                    <div style="display:flex;gap:1rem;">
                        <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;
                                      padding:.6rem 1.1rem;border:1.5px solid var(--border);
                                      border-radius:var(--radius-sm);flex:1;font-weight:600;font-size:.85rem;">
                            <input type="radio" th:field="*{gender}" value="MALE" required="required" style="width:auto;"/>
                            <i class="bi bi-gender-male" style="color:var(--info);"></i> Мужской
                        </label>
                        <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;
                                      padding:.6rem 1.1rem;border:1.5px solid var(--border);
                                      border-radius:var(--radius-sm);flex:1;font-weight:600;font-size:.85rem;">
                            <input type="radio" th:field="*{gender}" value="FEMALE" required="required" style="width:auto;"/>
                            <i class="bi bi-gender-female" style="color:#EC4899;"></i> Женский
                        </label>
                    </div>
                </div>
                <div style="display:flex;gap:.75rem;margin-top:1.5rem;">
                    <button type="submit" class="btn btn--primary btn--lg" style="flex:1;">
                        <i class="bi bi-person-plus-fill"></i> Зарегистрировать
                    </button>
                    <a href="/clients" class="btn btn--ghost btn--lg">Отмена</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
