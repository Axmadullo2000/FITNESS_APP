<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Шкафчики', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Шкафчики</h1>
            <p class="page-subtitle">Карта шкафчиков раздевалок</p>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" style="margin-bottom:1.5rem;">
        <div class="stat-card stat-card--blue">
            <div class="stat-card__body">
                <div class="stat-card__label">Муж. свободно</div>
                <div class="stat-card__value" th:text="${maleFreeCount}">0</div>
            </div>
            <div class="stat-card__icon"><i class="bi bi-gender-male"></i></div>
        </div>
        <div class="stat-card stat-card--orange">
            <div class="stat-card__body">
                <div class="stat-card__label">Муж. занято</div>
                <div class="stat-card__value" th:text="${maleOccupiedCount}">0</div>
            </div>
            <div class="stat-card__icon"><i class="bi bi-lock-fill"></i></div>
        </div>
        <div class="stat-card stat-card--purple">
            <div class="stat-card__body">
                <div class="stat-card__label">Жен. свободно</div>
                <div class="stat-card__value" th:text="${femaleFreeCount}">0</div>
            </div>
            <div class="stat-card__icon"><i class="bi bi-gender-female"></i></div>
        </div>
        <div class="stat-card stat-card--red">
            <div class="stat-card__body">
                <div class="stat-card__label">Жен. занято</div>
                <div class="stat-card__value" th:text="${femaleOccupiedCount}">0</div>
            </div>
            <div class="stat-card__icon"><i class="bi bi-lock-fill"></i></div>
        </div>
    </div>

    <!-- Legend -->
    <div style="display:flex;align-items:center;gap:1.25rem;margin-bottom:1.25rem;">
        <div style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--text-muted);">
            <div style="width:14px;height:14px;border-radius:3px;background:var(--success-muted);border:2px solid var(--success);"></div>
            Свободен
        </div>
        <div style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--text-muted);">
            <div style="width:14px;height:14px;border-radius:3px;background:var(--warning-muted);border:2px solid var(--warning);"></div>
            Занят
        </div>
    </div>

    <div class="locker-sections-grid">

        <!-- Men's -->
        <div class="card">
            <div class="card-header">
                <span class="card-header__title">
                    <i class="bi bi-gender-male" style="color:var(--info);"></i>
                    Мужские шкафчики (1–50)
                </span>
                <span class="badge badge--blue">
                    <span th:text="${maleFreeCount}"></span> свободно
                </span>
            </div>
            <div class="locker-map">
                <div th:each="locker : ${maleLockers}"
                     class="locker-cell"
                     th:classappend="${locker.status.name() == 'FREE'} ? ' locker-cell--free' : ' locker-cell--occupied'">
                    <i th:class="${locker.status.name() == 'FREE'} ? 'bi bi-unlock' : 'bi bi-lock-fill'"></i>
                    <span th:text="${locker.lockerNumber}"></span>
                </div>
            </div>
        </div>

        <!-- Women's -->
        <div class="card">
            <div class="card-header">
                <span class="card-header__title">
                    <i class="bi bi-gender-female" style="color:#EC4899;"></i>
                    Женские шкафчики (1–50)
                </span>
                <span class="badge badge--female">
                    <span th:text="${femaleFreeCount}"></span> свободно
                </span>
            </div>
            <div class="locker-map">
                <div th:each="locker : ${femaleLockers}"
                     class="locker-cell"
                     th:classappend="${locker.status.name() == 'FREE'} ? ' locker-cell--free' : ' locker-cell--occupied'">
                    <i th:class="${locker.status.name() == 'FREE'} ? 'bi bi-unlock' : 'bi bi-lock-fill'"></i>
                    <span th:text="${locker.lockerNumber}"></span>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
