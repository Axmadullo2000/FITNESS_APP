<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Шкафчики', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <h4 class="fw-bold mb-4"><i class="bi bi-key me-2"></i>Шкафчики</h4>

    <!-- Статистика -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card card-stat shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1"><i class="bi bi-gender-male me-1"></i>Муж. свободно</h6>
                            <h3 class="fw-bold text-primary mb-0" th:text="${maleFreeCount}"></h3>
                        </div>
                        <i class="bi bi-check-circle fs-1 text-primary opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1"><i class="bi bi-gender-male me-1"></i>Муж. занято</h6>
                            <h3 class="fw-bold text-warning mb-0" th:text="${maleOccupiedCount}"></h3>
                        </div>
                        <i class="bi bi-lock fs-1 text-warning opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1"><i class="bi bi-gender-female me-1"></i>Жен. свободно</h6>
                            <h3 class="fw-bold text-danger mb-0" th:text="${femaleFreeCount}"></h3>
                        </div>
                        <i class="bi bi-check-circle fs-1 text-danger opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1"><i class="bi bi-gender-female me-1"></i>Жен. занято</h6>
                            <h3 class="fw-bold text-warning mb-0" th:text="${femaleOccupiedCount}"></h3>
                        </div>
                        <i class="bi bi-lock fs-1 text-warning opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Мужские шкафчики -->
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold bg-primary text-white">
                    <i class="bi bi-gender-male me-1"></i>Мужские шкафчики (1-50)
                </div>
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2">
                        <div th:each="locker : ${maleLockers}"
                             th:classappend="${locker.status.name() == 'FREE'} ? 'bg-success' : 'bg-warning'"
                             class="d-flex flex-column align-items-center justify-content-center text-white rounded"
                             style="width: 50px; height: 50px; font-weight: bold;">
                            <span th:text="${locker.lockerNumber}"></span>
                            <small th:if="${locker.status.name() == 'OCCUPIED'}" class="text-dark" style="font-size: 0.6rem;">занят</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Женские шкафчики -->
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold bg-danger text-white">
                    <i class="bi bi-gender-female me-1"></i>Женские шкафчики (51-100)
                </div>
                <div class="card-body">
                    <div class="d-flex flex-wrap gap-2">
                        <div th:each="locker : ${femaleLockers}"
                             th:classappend="${locker.status.name() == 'FREE'} ? 'bg-success' : 'bg-warning'"
                             class="d-flex flex-column align-items-center justify-content-center text-white rounded"
                             style="width: 50px; height: 50px; font-weight: bold;">
                            <span th:text="${locker.lockerNumber}"></span>
                            <small th:if="${locker.status.name() == 'OCCUPIED'}" class="text-dark" style="font-size: 0.6rem;">занят</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 d-flex gap-3">
        <span><span class="badge bg-success">&nbsp;</span> Свободен</span>
        <span><span class="badge bg-warning">&nbsp;</span> Занят</span>
    </div>

</div>
</body>
</html>
