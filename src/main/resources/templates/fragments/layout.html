<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — GymApp'">GymApp</title>
    <script>
        (function(){
            var t = localStorage.getItem('gymapp-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            /* Restore sidebar-collapsed on desktop immediately to avoid flash */
            if (window.innerWidth > 1024 && localStorage.getItem('sidebar-collapsed') === 'true') {
                document.documentElement.classList.add('pre-collapsed');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        html.pre-collapsed .app-sidebar { transform: translateX(-100%) !important; }
        html.pre-collapsed .app-navbar  { left: 0 !important; }
        html.pre-collapsed .app-shell   { margin-left: 0 !important; }
    </style>
</head>
<body>

<!-- Sidebar overlay (tablet) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="app-sidebar" id="appSidebar">
    <a class="sidebar-logo" href="/">
        <div class="sidebar-logo__icon"><i class="bi bi-activity"></i></div>
        <span class="sidebar-logo__name">GymApp</span>
    </a>
    <nav class="sidebar-nav">
        <span class="sidebar-section">Главная</span>
        <a class="sidebar-link" th:classappend="${requestURI == '/'} ? ' active'" href="/">
            <i class="bi bi-speedometer2"></i> Админская панель
        </a>
        <span class="sidebar-section">Управление</span>
        <a class="sidebar-link" th:classappend="${requestURI.startsWith('/clients')} ? ' active'" href="/clients">
            <i class="bi bi-people"></i> Клиенты
        </a>
        <a class="sidebar-link" th:classappend="${requestURI.startsWith('/visits')} ? ' active'" href="/visits">
            <i class="bi bi-door-open"></i> Вход / Выход
        </a>
        <a class="sidebar-link" th:classappend="${requestURI.startsWith('/lockers')} ? ' active'" href="/lockers">
            <i class="bi bi-key"></i> Шкафчики
        </a>
        <span class="sidebar-section">Инструменты</span>
        <a class="sidebar-link sidebar-link--scanner" href="/scan" target="_blank">
            <i class="bi bi-qr-code-scan"></i> QR Сканер
        </a>
    </nav>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout" style="width:100%;justify-content:center;">
                <i class="bi bi-box-arrow-left"></i> Выйти из системы
            </button>
        </form>
    </div>
</aside>

<!-- Navbar -->
<header class="app-navbar">
    <div class="app-navbar__left">
        <button class="btn-hamburger" id="hamburger" aria-label="Меню">
            <i class="bi bi-list" id="hamburgerIcon"></i>
        </button>
        <span class="app-navbar__time"
              th:text="${#temporals.format(#temporals.createNow(), 'dd MMMM yyyy · HH:mm')}">
        </span>
    </div>
    <div class="app-navbar__right">
        <button class="btn-theme" id="themeToggle" aria-label="Тема">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
        <!-- Logout shown only on mobile (sidebar footer not visible there) -->
        <form th:action="@{/logout}" method="post" class="btn-logout-mobile">
            <button type="submit" class="btn-logout-icon" aria-label="Выйти">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
        <div class="app-navbar__user">
            <div class="app-navbar__avatar">AD</div>
            <span class="app-navbar__name" sec:authentication="name">admin</span>
        </div>
    </div>
</header>

<!-- Shell -->
<div class="app-shell">
    <main class="app-main">
        <div th:if="${success}" class="alert alert--success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert--danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:replace="${content}"></div>
    </main>
</div>

<!-- Bottom nav (mobile ≤640px only) -->
<nav class="bottom-nav">
    <a class="bottom-nav__item" th:classappend="${requestURI == '/'} ? ' active'" href="/">
        <i class="bi bi-speedometer2"></i><span>Админская панель</span>
    </a>
    <a class="bottom-nav__item" th:classappend="${requestURI.startsWith('/clients')} ? ' active'" href="/clients">
        <i class="bi bi-people"></i><span>Клиенты</span>
    </a>
    <a class="bottom-nav__item" th:classappend="${requestURI.startsWith('/visits')} ? ' active'" href="/visits">
        <i class="bi bi-door-open"></i><span>Визиты</span>
    </a>
    <a class="bottom-nav__item" th:classappend="${requestURI.startsWith('/lockers')} ? ' active'" href="/lockers">
        <i class="bi bi-key"></i><span>Шкафчики</span>
    </a>
    <a class="bottom-nav__item" href="/scan" target="_blank">
        <i class="bi bi-qr-code-scan"></i><span>Сканер</span>
    </a>
</nav>

<script>
    /* ── Theme ──────────────────────────────────────────────── */
    var html = document.documentElement;
    var themeIcon = document.getElementById('themeIcon');

    function applyTheme(t) {
        html.setAttribute('data-theme', t);
        localStorage.setItem('gymapp-theme', t);
        if (themeIcon) themeIcon.className = t === 'light' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    }
    applyTheme(localStorage.getItem('gymapp-theme') || 'dark');

    document.getElementById('themeToggle').addEventListener('click', function () {
        applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* ── Sidebar ────────────────────────────────────────────── */
    var body      = document.body;
    var sidebar   = document.getElementById('appSidebar');
    var overlay   = document.getElementById('sidebarOverlay');
    var hamburger = document.getElementById('hamburger');

    function isDesktop() { return window.innerWidth > 1024; }
    function isMobile()  { return window.innerWidth <= 640; }

    /* Restore desktop collapsed state (remove pre-collapsed helper class) */
    if (isDesktop() && localStorage.getItem('sidebar-collapsed') === 'true') {
        body.classList.add('sidebar-collapsed');
    }
    html.classList.remove('pre-collapsed');

    function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('show');
    }
    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    }

    hamburger.addEventListener('click', function () {
        if (isMobile()) return; /* bottom nav handles mobile, no sidebar */

        if (isDesktop()) {
            /* Desktop: toggle persistent collapse */
            var collapsed = body.classList.toggle('sidebar-collapsed');
            localStorage.setItem('sidebar-collapsed', collapsed);
        } else {
            /* Tablet: overlay open/close */
            sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        }
    });

    if (overlay) overlay.addEventListener('click', closeSidebar);

    /* Re-evaluate on resize so switching breakpoints works cleanly */
    window.addEventListener('resize', function () {
        if (isDesktop()) {
            closeSidebar(); /* clean up any tablet overlay state */
        }
        if (isMobile()) {
            body.classList.remove('sidebar-collapsed');
        }
    });
</script>

</body>
</html>
