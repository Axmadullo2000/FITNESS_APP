<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(title, content)" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — GymApp'">GymApp</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; font-size: 1.3rem; }
        .sidebar { min-height: calc(100vh - 56px); background: #212529; }
        .sidebar .nav-link { color: #adb5bd; padding: .6rem 1rem; border-radius: 6px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #343a40; color: #fff; }
        .sidebar .nav-link i { margin-right: .5rem; }
        .card-stat { border-left: 4px solid; }
        .card-stat.green  { border-color: #198754; }
        .card-stat.blue   { border-color: #0d6efd; }
        .card-stat.orange { border-color: #fd7e14; }
        .card-stat.red    { border-color: #dc3545; }
        .badge-sessions { font-size: .85rem; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/"><i class="bi bi-activity me-1"></i>GymApp</a>
    <span class="text-secondary small" th:text="${#temporals.format(#temporals.createNow(), 'dd.MM.yyyy HH:mm')}"></span>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 sidebar pt-3">
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/'} ? 'active'"
                       href="/">
                        <i class="bi bi-speedometer2"></i> Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/visits'} ? 'active'"
                       href="/visits">
                        <i class="bi bi-door-open"></i> Вход / Выход
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/clients'} ? 'active'"
                       href="/clients">
                        <i class="bi bi-people"></i> Клиенты
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/lockers'} ? 'active'"
                       href="/lockers">
                        <i class="bi bi-key"></i> Шкафчики
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 py-4 px-4">
            <!-- Flash messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:replace="${content}"><!-- content --></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
