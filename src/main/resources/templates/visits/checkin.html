<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Вход / Выход', ~{::body-content})}">
<body>
<div th:fragment="body-content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Вход / Выход</h1>
            <p class="page-subtitle">Ручная регистрация посещений</p>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start;">

        <!-- Check-in panel -->
        <div class="card">
            <div class="card-header">
                <span class="card-header__title">
                    <i class="bi bi-box-arrow-in-right" style="color:var(--success);"></i>
                    Регистрация входа
                </span>
            </div>
            <div class="card-body">
                <form method="get" action="/visits" style="margin-bottom:1.25rem;">
                    <div class="search-bar">
                        <i class="bi bi-search search-bar__icon"></i>
                        <input type="text" name="q" th:value="${param.q}"
                               placeholder="Поиск клиента по имени или телефону…"/>
                    </div>
                </form>

                <div th:if="${#lists.isEmpty(clients)}" class="empty-state" style="padding:2.5rem 1rem;">
                    <i class="bi bi-person-x"></i>
                    <div class="empty-state__title">Клиенты не найдены</div>
                    <div style="font-size:.77rem;">Введите имя или телефон для поиска</div>
                </div>

                <div th:unless="${#lists.isEmpty(clients)}"
                     style="display:flex;flex-direction:column;gap:.75rem;">
                    <div th:each="client : ${clients}"
                         style="background:var(--surface-2);border:1.5px solid var(--border);
                                border-radius:var(--radius-sm);padding:1rem 1.25rem;
                                transition:border-color var(--transition);">
                        <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem;">
                            <div th:classappend="${client.gender != null and client.gender.name() == 'MALE'} ? ' client-avatar--m' : ' client-avatar--f'"
                                 class="client-avatar"
                                 th:text="${#strings.substring(client.firstName,0,1) + #strings.substring(client.lastName,0,1)}">
                            </div>
                            <div style="flex:1;">
                                <div style="font-weight:700;font-size:.9rem;" th:text="${client.fullName}"></div>
                                <div style="font-size:.77rem;color:var(--text-muted);" th:text="${client.phone}"></div>
                            </div>
                            <span th:if="${client.gender != null}" class="badge"
                                  th:classappend="${client.gender.name() == 'MALE'} ? ' badge--male' : ' badge--female'">
                                <i th:class="${client.gender.name() == 'MALE'} ? 'bi bi-gender-male' : 'bi bi-gender-female'"></i>
                                <span th:text="${client.gender.name() == 'MALE'} ? 'Муж' : 'Жен'"></span>
                            </span>
                        </div>
                        <form th:action="@{/visits/checkin/{id}(id=${client.id})}" method="post">
                            <div style="display:flex;gap:.6rem;align-items:center;">
                                <select name="lockerId" class="form-select" style="flex:1;" required="required">
                                    <option value="">— Выберите шкафчик —</option>
                                    <option th:each="locker : ${clientLockers.get(client.id)}"
                                            th:value="${locker.id}"
                                            th:text="'№' + ${locker.lockerNumber}"></option>
                                </select>
                                <button type="submit" class="btn btn--success" style="white-space:nowrap;">
                                    <i class="bi bi-box-arrow-in-right"></i> Вход
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Currently in gym -->
        <div class="card">
            <div class="card-header">
                <span class="card-header__title">
                    <i class="bi bi-people-fill" style="color:var(--brand);"></i>
                    Сейчас в зале
                </span>
                <span class="badge badge--orange" th:text="${#lists.size(currentVisits)} + ' чел.'"></span>
            </div>
            <div class="card-body-0">
                <div th:if="${#lists.isEmpty(currentVisits)}" class="empty-state" style="padding:3rem;">
                    <i class="bi bi-moon-stars"></i>
                    <div class="empty-state__title">Зал пуст</div>
                    <div style="font-size:.77rem;">Посетители появятся после регистрации</div>
                </div>
                <div class="table-wrap">
                <table th:unless="${#lists.isEmpty(currentVisits)}" class="data-table">
                    <thead>
                    <tr>
                        <th>Клиент</th>
                        <th>Шкафчик</th>
                        <th>Вход</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="visit : ${currentVisits}">
                        <td>
                            <div class="client-row">
                                <div th:classappend="${visit.client.gender != null and visit.client.gender.name() == 'MALE'} ? ' client-avatar--m' : ' client-avatar--f'"
                                     class="client-avatar"
                                     style="width:32px;height:32px;font-size:.65rem;"
                                     th:text="${#strings.substring(visit.client.firstName,0,1) + #strings.substring(visit.client.lastName,0,1)}">
                                </div>
                                <a th:href="@{/clients/{id}(id=${visit.client.id})}"
                                   class="client-row__name"
                                   th:text="${visit.client.fullName}"></a>
                            </div>
                        </td>
                        <td>
                            <span class="badge badge--orange">
                                <i class="bi bi-key"></i>
                                №<span th:text="${visit.locker.lockerNumber}"></span>
                            </span>
                        </td>
                        <td style="color:var(--text-muted);"
                            th:text="${#temporals.format(visit.checkIn,'HH:mm')}"></td>
                        <td style="text-align:right;">
                            <form th:action="@{/visits/checkout/{id}(id=${visit.client.id})}" method="post">
                                <button type="submit" class="btn btn--danger btn--sm">
                                    <i class="bi bi-box-arrow-right"></i> Выход
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
