<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Главная', ~{::body-content})}">
<body>
    <div th:fragment="body-content">

        <h4 class="fw-bold mb-4"><i class="bi bi-speedometer2 me-2"></i>Панель управления</h4>

        <!-- Статистика -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card card-stat blue shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Сейчас в зале</h6>
                                <h3 class="fw-bold text-primary mb-0" th:text="${visitorsCount}"></h3>
                            </div>
                            <i class="bi bi-people fs-1 text-primary opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat green shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Свободных шкафчиков</h6>
                                <h3 class="fw-bold text-success mb-0" th:text="${freeLockers}"></h3>
                            </div>
                            <i class="bi bi-key fs-1 text-success opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat orange shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Занятых шкафчиков</h6>
                                <h3 class="fw-bold text-warning mb-0" th:text="${occupiedLockers}"></h3>
                            </div>
                            <i class="bi bi-lock fs-1 text-warning opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat red shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Всего клиентов</h6>
                                <h3 class="fw-bold text-danger mb-0" th:text="${totalClients}"></h3>
                            </div>
                            <i class="bi bi-person-badge fs-1 text-danger opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Быстрые действия -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <a href="/visits" class="card shadow-sm text-decoration-none h-100">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-door-open fs-1 text-success mb-2 d-block"></i>
                        <h6 class="fw-semibold text-dark">Вход / Выход</h6>
                        <small class="text-muted">Регистрация посещений</small>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/clients" class="card shadow-sm text-decoration-none h-100">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-people fs-1 text-primary mb-2 d-block"></i>
                        <h6 class="fw-semibold text-dark">Клиенты</h6>
                        <small class="text-muted">Управление клиентами</small>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/lockers" class="card shadow-sm text-decoration-none h-100">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-key fs-1 text-warning mb-2 d-block"></i>
                        <h6 class="fw-semibold text-dark">Шкафчики</h6>
                        <small class="text-muted">Статус шкафчиков</small>
                    </div>
                </a>
            </div>
        </div>

        <!-- Текущие посетители -->
        <div class="card shadow-sm">
            <div class="card-header fw-semibold d-flex justify-content-between align-items-center">
                <span><i class="bi bi-people me-1"></i>Сейчас в зале</span>
                <a href="/visits" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-door-open me-1"></i>Управление
                </a>
            </div>
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(currentVisits)}" class="text-muted text-center py-4">
                    <i class="bi bi-emoji-neutral fs-2 d-block mb-2"></i>
                    В зале никого нет
                </div>

                <table th:unless="${#lists.isEmpty(currentVisits)}" class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Клиент</th>
                        <th>Шкафчик</th>
                        <th>Время входа</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="visit, stat : ${currentVisits}">
                        <td class="text-muted" th:text="${stat.count}"></td>
                        <td>
                            <a th:href="@{/clients/{id}(id=${visit.client.id})}"
                               class="text-decoration-none fw-semibold"
                               th:text="${visit.client.fullName}"></a>
                        </td>
                        <td>
                            <span class="badge bg-secondary">№<span th:text="${visit.locker.lockerNumber}"></span></span>
                        </td>
                        <td th:text="${#temporals.format(visit.checkIn, 'HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
